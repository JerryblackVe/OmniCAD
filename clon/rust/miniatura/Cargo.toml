[package]
name = "omnicad-miniatura"
version = "0.1.0"
edition = "2021"
description = "Proveedor de miniaturas de Windows (IThumbnailProvider) para los proyectos .omnicad"
license = "GPL-3.0-or-later"

[lib]
name = "omnicad_miniatura"
crate-type = ["cdylib"]

[dependencies]
miniz_oxide = "0.8"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = "s"
lto = true
