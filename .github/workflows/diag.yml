name: Diagnostico tanda
# Temporal: un job por archivo para ver cuál mata al runner. Se borra al terminar.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archivo:
    runs-on: windows-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        f: [test_la_vista_previa_muestra_el_mecanismo_movido_y_no_toca_el_documento, test_un_valor_enorme_se_rechaza_sin_cerrar_el_panel_ni_romper_la_union, test_aceptar_aplica_el_valor_con_ctx_sin_ventana, test_asa_de_giro_gira_y_la_de_distancia_desliza, test_una_union_rigida_no_tiene_asas, test_la_union_que_sigue_a_un_vinculo_se_rechaza_en_el_panel_y_no_tiene_asas]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m venv clon/.venv
          clon/.venv/Scripts/python.exe -m pip install -q -r clon/requirements.txt -r clon/requirements-dev.txt
      - run: .venv/Scripts/python.exe -m pytest tests/test_gizmo_accionar.py::${{ matrix.f }} -q -o faulthandler_timeout=120
        working-directory: clon
