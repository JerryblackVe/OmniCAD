# Arma los instaladores de OmniCAD (Windows .exe y Linux AppImage) con instalador/armar.py.
# - Al subir una etiqueta de versión (git tag v0.1.0 && git push origin v0.1.0): los arma y los publica en GitHub Releases.
# - A mano (pestaña Actions › Instaladores › Run workflow): los arma y los deja como artefactos, sin publicar nada.
# - En cada pull request: corre los tests del job «test» (los instaladores se arman como artefactos, sin publicar nada).
name: Instaladores

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read    # solo el job «publicar» necesita escribir

jobs:
  test:
    # Corre ruff y pytest (AGENTS.md › Cómo verificar) antes de armar o publicar nada.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Escaneo de secretos
        # Sin actions de terceros: Python puro sobre los archivos trackeados. Falsos positivos conocidos:
        # el token de mentira "no-es-el-token" (clon/tests/test_puente.py) y las contraseñas de los tests.
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, sys
          PATRONES = [
              ("clave de Stripe", r"sk_live_[A-Za-z0-9]{16,}"),
              ("clave de acceso de AWS", r"AKIA[0-9A-Z]{16}"),
              ("clave de API de Google", r"AIza[0-9A-Za-z_\-]{35}"),
              ("token de GitHub", r"ghp_[0-9A-Za-z]{36}"),
              ("token de Slack", r"xox[baprs]-[0-9A-Za-z\-]{10,}"),
              ("clave privada", r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----"),
              ("contraseña hardcodeada", r"(?i)password\s*=\s*['\"][^'\"$]{8,}['\"]"),
          ]
          archivos = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.splitlines()
          hallados = []
          for archivo in archivos:
              try:
                  texto = open(archivo, encoding="utf-8", errors="ignore").read()
              except OSError:
                  continue
              ruta = archivo.replace("\\", "/")
              es_test = "/tests/" in ruta or "/test_" in ruta or ruta.startswith("tests/")
              for n, linea in enumerate(texto.splitlines(), 1):
                  if "no-es-el-token" in linea:            # falso positivo conocido (test_puente.py)
                      continue
                  for nombre, patron in PATRONES:
                      if nombre == "contraseña hardcodeada" and es_test:  # en los tests hay claves de mentira
                          continue
                      if re.search(patron, linea):
                          hallados.append(f"{archivo}:{n}: {nombre}: {linea.strip()[:100]}")
          if hallados:
              print("\n".join(hallados))
              sys.exit(1)
          print(f"Escaneo de secretos: 0 hallazgos en {len(archivos)} archivos.")
          PY
      - name: Dependencias
        run: |
          python -m venv clon/.venv
          clon/.venv/Scripts/python.exe -m pip install -r clon/requirements.txt -r clon/requirements-dev.txt
      - name: Ruff
        run: .venv/Scripts/python.exe -m ruff check .
        working-directory: clon    # el criterio vive en clon/pyproject.toml › [tool.ruff.lint]
      - name: Tests
        run: .venv/Scripts/python.exe -m pytest tests -q
        working-directory: clon    # AGENTS.md › Cómo verificar: todo se corre desde clon/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m venv clon/.venv
          clon/.venv/Scripts/python.exe -m pip install -r clon/requirements.txt -r instalador/requisitos.txt
      - name: Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Armar el instalador
        run: clon/.venv/Scripts/python.exe instalador/armar.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: instalador/dist/*.exe

  linux:
    # 22.04 y no la última: el AppImage solo corre en sistemas con una glibc igual o más nueva que la de donde se armó.
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Librerías del sistema que pide Qt (README › Instalación (Linux))
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 \
            libfontconfig1 libdbus-1-3
      - name: Dependencias
        run: |
          python -m venv clon/.venv
          clon/.venv/bin/python -m pip install -r clon/requirements.txt -r instalador/requisitos.txt
      - name: Armar el AppImage
        run: clon/.venv/bin/python instalador/armar.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: instalador/dist/*.AppImage

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, linux]
    permissions:
      contents: write    # crear la Release de GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298a4eeaf626c5b8d85266b0e65    # v2, pineada al SHA (git ls-remote refs/tags/v2)
        with:
          files: instaladores/*
          generate_release_notes: true
